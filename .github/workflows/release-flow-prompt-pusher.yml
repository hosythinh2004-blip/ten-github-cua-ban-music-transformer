name: Release Flow Prompt Pusher Extension

on:
  push:
    branches: [main]
    paths:
      - 'flow-prompt-pusher-extension/**'
      - '.github/workflows/release-flow-prompt-pusher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          cd flow-prompt-pusher-extension
          zip -r ../Flow-Prompt-Pusher-Chrome-Extension.zip manifest.json content.js styles.css README.md
          cd ..
          unzip -t Flow-Prompt-Pusher-Chrome-Extension.zip

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='flow-prompt-pusher-v1.0.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Flow-Prompt-Pusher-Chrome-Extension.zip --clobber
          else
            gh release create "$TAG" Flow-Prompt-Pusher-Chrome-Extension.zip \
              --title 'Flow Prompt Pusher v1.0.0' \
              --notes 'Chrome Extension cho Google Flow/Veo: dùng phiên Google đang đăng nhập, 1 dòng = 1 prompt, tự điền prompt và bấm Generate. Không cần Gemini API key.'
          fi
