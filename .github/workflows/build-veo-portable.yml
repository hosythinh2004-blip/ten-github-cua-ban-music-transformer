name: Build VEO Auto Video Studio Portable

on:
  push:
    paths:
      - 'veo-auto-video-studio-portable/**'
      - '.github/workflows/build-veo-portable.yml'
  pull_request:
    paths:
      - 'veo-auto-video-studio-portable/**'
      - '.github/workflows/build-veo-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: veo-auto-video-studio-portable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install builder
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Build Windows EXE
        run: npm run build:win

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\VEO-Auto-Video-Studio.exe' -DestinationPath 'dist\VEO-Auto-Video-Studio-Windows-x64.zip' -Force

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'veo-auto-video-studio-v1.1.0'
          $zip = 'dist\VEO-Auto-Video-Studio-Windows-x64.zip'
          $exe = 'dist\VEO-Auto-Video-Studio.exe'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe --title 'VEO AUTO VIDEO STUDIO v1.1.0' --notes 'Windows x64 portable build. Download ZIP, extract, then run VEO-Auto-Video-Studio.exe. No Node or Python installation required.'
          }

      - name: Verify build files
        shell: pwsh
        run: |
          Get-Item 'dist\VEO-Auto-Video-Studio.exe'
          Get-Item 'dist\VEO-Auto-Video-Studio-Windows-x64.zip'
