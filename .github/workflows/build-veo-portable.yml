name: Build VEO Auto Video Studio Portable

on:
  push:
    paths:
      - 'veo-auto-video-studio-portable/**'
      - '.github/workflows/build-veo-portable.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: veo-auto-video-studio-portable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install builder
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Build Windows EXE
        run: npm run build:win

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\VEO-Auto-Video-Studio.exe' -DestinationPath 'dist\VEO-Auto-Video-Studio-Windows-x64.zip' -Force

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: VEO-Auto-Video-Studio-Windows-x64
          path: |
            veo-auto-video-studio-portable/dist/VEO-Auto-Video-Studio.exe
            veo-auto-video-studio-portable/dist/VEO-Auto-Video-Studio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
