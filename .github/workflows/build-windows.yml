name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app_v5.py"
      - "api_server_v5.py"
      - "suno_engine_v5.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m py_compile suno_engine_v5.py
          python -m py_compile api_server_v5.py
          python -m py_compile app_v5.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name SunoAudioConverter `
            --collect-all imageio_ffmpeg `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all uvicorn `
            --hidden-import suno_engine_v5 `
            --hidden-import api_server_v5 `
            app_v5.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SunoAudioConverter-Windows-v5
          path: dist/SunoAudioConverter.exe
          if-no-files-found: error
          retention-days: 30
